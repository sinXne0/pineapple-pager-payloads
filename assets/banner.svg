<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Dark Sec Labz - Pineapple Pager Payloads">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08040d"/>
      <stop offset="0.55" stop-color="#150a23"/>
      <stop offset="1" stop-color="#241039"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6efff"/>
      <stop offset="0.5" stop-color="#d1acff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2fd6"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a56bff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a56bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2fd6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2fd6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <ellipse cx="1270" cy="80" rx="430" ry="240" fill="url(#glowA)"/>
  <ellipse cx="250" cy="340" rx="380" ry="220" fill="url(#glowB)"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M 46 46 H 118 M 46 46 V 118"/>
    <path d="M 1554 46 H 1482 M 1554 46 V 118"/>
    <path d="M 46 354 H 118 M 46 354 V 282"/>
    <path d="M 1554 354 H 1482 M 1554 354 V 282"/>
  </g>

  <!-- Skull + WiFi arcs (left) -->
  <g transform="translate(178 202)">
    <g fill="#eadfff">
      <ellipse cx="0" cy="-18" rx="64" ry="60"/>
      <path d="M -42 26 q 6 34 42 34 q 36 0 42 -34 z"/>
    </g>
    <g fill="#12091f">
      <ellipse cx="-26" cy="-24" rx="17" ry="19" transform="rotate(-8 -26 -24)"/>
      <ellipse cx="26" cy="-24" rx="17" ry="19" transform="rotate(8 26 -24)"/>
      <path d="M 0 -2 l -10 18 h 20 z"/>
      <rect x="-30" y="42" width="4" height="18" rx="2"/>
      <rect x="-15" y="44" width="4" height="18" rx="2"/>
      <rect x="0" y="45" width="4" height="18" rx="2"/>
      <rect x="15" y="44" width="4" height="18" rx="2"/>
    </g>
    <g fill="none" stroke="url(#neon)" stroke-linecap="round">
      <path d="M 52 -34 a 44 44 0 0 1 0 68" stroke-width="7" opacity="0.95"/>
      <path d="M 70 -54 a 70 70 0 0 1 0 108" stroke-width="7" opacity="0.7"/>
      <path d="M 88 -74 a 96 96 0 0 1 0 148" stroke-width="7" opacity="0.45"/>
    </g>
    <circle cx="52" cy="0" r="6" fill="#ff2fd6"/>
  </g>

  <!-- Pineapple outline + circuit (right) -->
  <g transform="translate(1408 202)" fill="none" stroke="#d1acff" stroke-linecap="round">
    <ellipse cx="0" cy="8" rx="52" ry="68" stroke-width="3" opacity="0.65"/>
    <path d="M -52 -8 H 52 M -50 26 H 50 M -44 54 H 44" stroke-width="2" opacity="0.32"/>
    <path d="M -26 -52 L -38 -88 L -12 -70 L 0 -102 L 12 -70 L 38 -88 L 26 -52" stroke-width="3" opacity="0.7"/>
    <path d="M -52 -8 L -80 6 M 52 -8 L 80 6" stroke-width="2" opacity="0.5"/>
    <circle cx="-80" cy="6" r="4" fill="#ff2fd6" stroke="none"/>
    <circle cx="80" cy="6" r="4" fill="#7a5cff" stroke="none"/>
    <circle cx="-18" cy="26" r="3" fill="#d1acff" stroke="none" opacity="0.8"/>
    <circle cx="20" cy="54" r="3" fill="#ff2fd6" stroke="none" opacity="0.8"/>
  </g>

  <!-- Center lockup -->
  <rect x="512" y="145" width="576" height="2" fill="url(#neon)" opacity="0.85"/>
  <text x="800" y="198" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="12" fill="url(#title)">DARK SEC LABZ</text>
  <text x="800" y="247" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="9" fill="#cbb9ec">PINEAPPLE PAGER PAYLOADS</text>
  <rect x="512" y="270" width="576" height="2" fill="url(#neon)" opacity="0.85"/>
  <text x="800" y="308" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="6" fill="#8d7aae">OFFENSIVE WIRELESS · NETWORK · OSINT</text>

  <!-- Sparkle accents -->
  <g fill="#d1acff">
    <circle cx="486" cy="176" r="2.5" opacity="0.9"/>
    <circle cx="1114" cy="176" r="2.5" opacity="0.9"/>
    <circle cx="462" cy="238" r="2" opacity="0.6"/>
    <circle cx="1138" cy="238" r="2" opacity="0.6"/>
  </g>
</svg>
